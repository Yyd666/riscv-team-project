name: Linux execution checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      analysis_ref:
        description: 'Optional trusted repository commit/ref for execution-analysis integration'
        required: false
        type: string

permissions:
  contents: read

jobs:
  execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-foundation.txt
      - name: Install RV64GC tools
        timeout-minutes: 3
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Execution behavior and failure paths
        run: python -m unittest discover -s backend/tests -v
      - name: All registered RV64GC cases, repeated
        run: python scripts/check_execution_real.py
      - name: Real CLI, reports and independent attribution checks
        run: python scripts/check_cli_real.py
      - name: Real attribution rejection states and evidence conflicts
        run: python scripts/run_attribution_negatives.py --output artifacts/attribution-negatives/summary.json
      - name: Traceable evaluation runner on registered smoke programs
        run: |
          python scripts/run_evaluation_corpus.py --corpus evaluation/corpus.json --output artifacts/evaluation-execution --diagnostic --program sum_u32 --program dot_i32 --program threshold_count
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from backend.app.reporting import load_result, load_attribution
          from scripts.check_execution_integration import validate
          from scripts.evaluate_attribution import evaluate
          batches = list(Path('artifacts/evaluation-execution').glob('evaluation-*/batch.json'))
          assert len(batches) == 1
          path = batches[0]
          batch = json.loads(path.read_bytes())
          assert batch['completed'] and batch['all_passed'] and batch['mode'] == 'diagnostic'
          assert batch['exit_code'] == 0 and not batch['acceptance_ready']
          for name, expected in batch['artifact_sha256'].items():
              assert hashlib.sha256((path.parent / name).read_bytes()).hexdigest() == expected
          for row in batch['programs']:
              source = Path(row['result_path'])
              validate(source.parent / 'execution.json', source, registry_root=path.parent / 'registry-repository')
              result = load_result(source)
              for candidate in ('O0', 'Os'):
                  load_attribution(source.parent / 'attribution' / f'O2-{candidate}' / 'attribution.json', result, source.read_bytes(), workspace=source.parent)
          summary = evaluate(Path('evaluation/corpus.json'), path.parent / 'experiments')
          assert summary['metrics']['independent_byte_error_denominator'] == 6
          assert summary['metrics']['byte_error_exact_rate'] == 1
          assert len(summary['formal_ineligible_programs']) == 3
          assert not summary['automated_checks_passed']
          print('PASS: evaluation execution evidence; diagnostic measurements remain excluded from formal acceptance')
          PY
      - name: Fetch analysis candidate for pull request integration
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin sjs
      - name: Integrate current analysis candidate on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/check_analysis_integration.py --analysis-ref FETCH_HEAD --output artifacts/analysis-integration
      - name: Integrate selected candidate analysis
        if: github.event_name == 'workflow_dispatch' && inputs.analysis_ref != ''
        env:
          ANALYSIS_REF: ${{ inputs.analysis_ref }}
        run: python scripts/check_analysis_integration.py --analysis-ref "$ANALYSIS_REF" --output artifacts/analysis-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-execution-evidence-${{ github.sha }}
          path: artifacts/evaluation-execution/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-negative-evidence-${{ github.sha }}
          path: artifacts/attribution-negatives/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-attribution-evidence-${{ github.sha }}
          path: artifacts/cli-check/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence-${{ github.sha }}
          path: artifacts/execution-check/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.analysis_ref != ''))
        with:
          name: analysis-integration-evidence-${{ github.sha }}
          path: artifacts/analysis-integration/
          retention-days: 30
          if-no-files-found: error
