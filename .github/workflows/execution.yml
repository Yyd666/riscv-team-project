name: Linux execution checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      analysis_ref:
        description: 'Optional trusted repository commit/ref for execution-analysis integration'
        required: false
        type: string

permissions:
  contents: read

jobs:
  execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-foundation.txt
      - name: Install RV64GC tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user
      - name: Execution behavior and failure paths
        run: python -m unittest discover -s backend/tests -v
      - name: All registered RV64GC cases, repeated
        run: python scripts/check_execution_real.py
      - name: Fetch analysis candidate for pull request integration
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin sjs
      - name: Integrate current analysis candidate on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/check_analysis_integration.py --analysis-ref FETCH_HEAD --output artifacts/analysis-integration
      - name: Integrate selected candidate analysis
        if: github.event_name == 'workflow_dispatch' && inputs.analysis_ref != ''
        env:
          ANALYSIS_REF: ${{ inputs.analysis_ref }}
        run: python scripts/check_analysis_integration.py --analysis-ref "$ANALYSIS_REF" --output artifacts/analysis-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-evidence-${{ github.sha }}
          path: artifacts/execution-check/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.analysis_ref != ''
        with:
          name: analysis-integration-evidence-${{ github.sha }}
          path: artifacts/analysis-integration/
          retention-days: 30
          if-no-files-found: error
